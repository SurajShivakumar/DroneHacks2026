name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check dronebench tools sim tests
      - run: python -m pytest tests -q
      - run: python -m dronebench strategies
      - run: python -m dronebench profile examples/synthetic_path.json --output artifacts/ci-profile.json
  team-planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
        working-directory: team/pathfinding
      - run: python -m pytest -q test_suraj_course.py
        working-directory: team/suraj_course
      - run: python -m pytest -q test
        working-directory: team/path_recorder
      - run: python -m pytest -q test
        working-directory: team/path_player
      - run: python -m pytest -q test_fly_course.py
        working-directory: flight_programs/flyx_course
      - run: python -m pytest -q test_fly_square.py
        working-directory: flight_programs/flyx_square
